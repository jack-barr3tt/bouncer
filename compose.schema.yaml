services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bouncer
      POSTGRES_PASSWORD: bouncer
      POSTGRES_DB: bouncer
    ports:
      - "${SCHEMA_PG_PORT:-5437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bouncer -d bouncer"]
      interval: 2s
      timeout: 5s
      retries: 30
