when:
  - event: pull_request

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bouncer
      POSTGRES_PASSWORD: bouncer
      POSTGRES_DB: bouncer

steps:
  - name: test-server
    image: golang:1.26-bookworm
    environment:
      TEST_DATABASE_URL: postgres://bouncer:bouncer@postgres:5432/bouncer?sslmode=disable
    commands:
      - make lint-server test-server

  - name: lint-hub
    image: node:22-alpine
    commands:
      - apk add --no-cache make
      - make lint-js test-client lint-hub test-hello test-scripts test-create
