when:
  - event: push
    branch: main

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bouncer
      POSTGRES_PASSWORD: bouncer
      POSTGRES_DB: bouncer

steps:
  - name: test-server
    depends_on: []
    image: golang:1.26-bookworm
    environment:
      TEST_DATABASE_URL: postgres://bouncer:bouncer@postgres:5432/bouncer?sslmode=disable
    commands:
      - make test-server

  - name: lint-hub
    depends_on: []
    image: node:22-alpine
    commands:
      - apk add --no-cache make
      - make lint-hub test-scripts test-create
