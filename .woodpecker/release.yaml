when:
  - event: tag
    ref: refs/tags/v*

concurrency:
  limit: 1

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bouncer
      POSTGRES_PASSWORD: bouncer
      POSTGRES_DB: bouncer

steps:
  - name: test-server
    depends_on: []
    image: golang:1.26-bookworm
    environment:
      TEST_DATABASE_URL: postgres://bouncer:bouncer@postgres:5432/bouncer?sslmode=disable
    commands:
      - make lint-server test-server

  - name: lint-hub
    depends_on: []
    image: node:22-alpine
    commands:
      - apk add --no-cache make
      - make lint-js lint-hub

  - name: publish-image
    image: docker:27-cli
    depends_on:
      - test-server
      - lint-hub
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY: ghcr.io/jack-barr3tt
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_TOKEN:
        from_secret: registry_token
      VERSION: ${CI_COMMIT_TAG##v}
    commands:
      - echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - |
        docker build \
          -t "$REGISTRY/bouncer:$VERSION" \
          -t "$REGISTRY/bouncer:latest" \
          .
      - docker push "$REGISTRY/bouncer:$VERSION"
      - docker push "$REGISTRY/bouncer:latest"
      - |
        docker build \
          --target builder \
          -t "$REGISTRY/bouncer-builder:$VERSION" \
          -t "$REGISTRY/bouncer-builder:latest" \
          .
      - docker push "$REGISTRY/bouncer-builder:$VERSION"
      - docker push "$REGISTRY/bouncer-builder:latest"

  - name: stage-packages
    image: node:22-alpine
    depends_on:
      - test-server
      - lint-hub
    environment:
      NPM_TOKEN:
        from_secret: npm_token
      VERSION: ${CI_COMMIT_TAG##v}
    commands:
      - echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - printf '%s\n' "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$HOME/.npmrc"
      - npm install -g npm@^11.15.0
      - (cd client && npm ci && npm version "$VERSION" --no-git-tag-version --allow-same-version && npm run build && npm stage publish --access public && npm stage list --json)
      - (cd create && npm ci && npm version "$VERSION" --no-git-tag-version --allow-same-version && npm run build && node vendor.mjs && npm stage publish --access public && npm stage list --json)

  - name: github-release
    image: node:22-alpine
    depends_on:
      - publish-image
      - stage-packages
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache git
      - git fetch --tags --unshallow origin || git fetch --tags origin
      - node scripts/github-release.mjs
