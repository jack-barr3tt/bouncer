when:
  - event: tag
    ref: refs/tags/v*

concurrency:
  limit: 1

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bouncer
      POSTGRES_PASSWORD: bouncer
      POSTGRES_DB: bouncer

steps:
  - name: test-server
    depends_on: []
    image: golang:1.26-bookworm
    environment:
      TEST_DATABASE_URL: postgres://bouncer:bouncer@postgres:5432/bouncer?sslmode=disable
    commands:
      - cd server && go test ./...

  - name: lint-hub
    depends_on: []
    image: node:22-alpine
    commands:
      - cd hub && npm ci && npm run lint

  - name: publish-image
    image: docker:27-cli
    depends_on:
      - test-server
      - lint-hub
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY: ghcr.io/jack-barr3tt
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_TOKEN:
        from_secret: registry_token
      VERSION: ${CI_COMMIT_TAG##v}
    commands:
      - echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - |
        docker build \
          -t "$REGISTRY/bouncer:$VERSION" \
          -t "$REGISTRY/bouncer:latest" \
          .
      - docker push "$REGISTRY/bouncer:$VERSION"
      - docker push "$REGISTRY/bouncer:latest"

  - name: publish-client
    image: node:22-alpine
    depends_on:
      - test-server
      - lint-hub
    environment:
      NPM_TOKEN:
        from_secret: npm_token
      VERSION: ${CI_COMMIT_TAG##v}
    commands:
      - echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
      - (cd client && npm ci && npm version "$VERSION" --no-git-tag-version --allow-same-version && npm publish --access public)
      - (cd create && npm ci && npm version "$VERSION" --no-git-tag-version --allow-same-version && npm publish --access public)
