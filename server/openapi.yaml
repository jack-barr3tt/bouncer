openapi: 3.0.3
info:
  title: Apps auth
  version: 0.1.0
  description: Shared sign-in for a directory of static apps.
paths:
  /api/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. Sets the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Signed out. Clears the session cookie.
  /api/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
  /api/access-codes/redeem:
    post:
      operationId: redeemAccessCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
      responses:
        "200":
          description: Temporary account created or resumed. Sets the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: Accounts an admin can manage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created. New accounts are regular users with no apps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/users/{id}:
    patch:
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/users/{id}/apps:
    put:
      operationId: setUserApps
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppListRequest"
      responses:
        "200":
          description: Replaced app grants. Each app is view only, or view and share.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/access-codes:
    get:
      operationId: listAccessCodes
      responses:
        "200":
          description: Access codes. An admin sees every code. Any other signed-in account sees the codes it owns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCodeList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: createAccessCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessCodeRequest"
      responses:
        "201":
          description: Created access code. The signed-in account owns it. An admin can share any app. Another account can share only apps an admin marked view and share.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCode"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/access-codes/{id}/revoke:
    post:
      operationId: revokeAccessCode
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Code revoked. An admin can revoke any code. The owner can revoke their own. Existing temporary accounts stay until they are revoked or the code expires.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCode"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/access-codes/{id}:
    delete:
      operationId: deleteAccessCode
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Code deleted. An admin can delete any code. The owner can delete their own. Temporary accounts and their sessions are removed, so anyone still signed in loses access immediately.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/access-codes/{id}/qr:
    get:
      operationId: getAccessCodeQR
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: PNG QR code of the join URL.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/access-codes/{id}/accounts:
    get:
      operationId: listTemporaryAccounts
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Temporary accounts created from this code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryAccountList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/temporary-accounts/{id}/revoke:
    post:
      operationId: revokeTemporaryAccount
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Temporary account revoked and its sessions deleted. An admin can revoke any. The owner of its access code can revoke their own.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/hooks/git:
    post:
      operationId: gitHook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Deploy started.
        "204":
          description: Event ignored.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/deploy:
    get:
      operationId: getDeploy
      responses:
        "200":
          description: Whether git deploy is configured, and the latest run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployStatus"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      operationId: triggerDeploy
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployRequest"
      responses:
        "202":
          description: Deploy started.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/deploy/run:
    post:
      operationId: runDeploy
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployRequest"
      responses:
        "202":
          description: Deploy of the branch tip started.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/deploy/repos/preview:
    post:
      operationId: previewRepo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoPreviewRequest"
      responses:
        "200":
          description: Apps found in the repository. Nothing is written to the site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoPreview"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/deploy/repos:
    post:
      operationId: addRepo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRepoRequest"
      responses:
        "204":
          description: Repository and apps added to apps.yaml.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/apps:
    get:
      operationId: listApps
      responses:
        "200":
          description: Apps the current session can open. A signed-out request returns public apps. An admin can open every app. Paths are the public URLs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCatalog"
    post:
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppRequest"
      responses:
        "204":
          description: App added to apps.yaml.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/apps/{slug}:
    patch:
      operationId: setAppPublic
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppPublicRequest"
      responses:
        "204":
          description: App is public or private. A public app can be opened without an account. Existing grants are kept.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/access/stream:
    get:
      operationId: accessStream
      responses:
        "200":
          description: |
            Server-sent events for the current session.
            Event `access` has data `{"apps":["slug"]}`.
            Event `session_ended` has data `{}`.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        fingerprint:
          type: string
    RedeemRequest:
      type: object
      required: [code, nickname, fingerprint]
      properties:
        code:
          type: string
        nickname:
          type: string
        fingerprint:
          type: string
    AppCatalog:
      type: object
      required: [apps]
      properties:
        apps:
          type: array
          items:
            $ref: "#/components/schemas/AppInfo"
    AppInfo:
      type: object
      required: [slug, name, description, path, icon, public]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        path:
          type: string
        icon:
          type: string
        public:
          type: boolean
          description: When true, anyone can open this app without an account.
    AppPublicRequest:
      type: object
      required: [public]
      properties:
        public:
          type: boolean
    Session:
      type: object
      required: [kind, apps, expiresAt, hub]
      properties:
        kind:
          type: string
          enum: [user, temporary]
        username:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum: [admin, user]
        apps:
          type: array
          items:
            type: string
        shareApps:
          type: array
          description: Apps this user session may share with a temporary access code.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        hub:
          type: string
          description: Public URL of the homepage.
    User:
      type: object
      required: [id, username, role, disabled, apps, shareApps]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        disabled:
          type: boolean
        apps:
          type: array
          description: Apps this account can open.
          items:
            type: string
        shareApps:
          type: array
          description: Apps this account can open and share with a temporary access code. A subset of apps.
          items:
            type: string
    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        password:
          type: string
        disabled:
          type: boolean
        role:
          type: string
          enum: [admin, user]
    AppGrant:
      type: object
      required: [slug, canShare]
      properties:
        slug:
          type: string
        canShare:
          type: boolean
          description: When true, the account can open this app and share temporary access codes for it. When false, the account can only open it.
    AppListRequest:
      type: object
      required: [grants]
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/AppGrant"
    AccessCode:
      type: object
      required: [id, code, label, url, expiresAt, maxSignups, signupCount, apps, ownerId, owner, createdAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        label:
          type: string
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
        maxSignups:
          type: integer
        signupCount:
          type: integer
        revokedAt:
          type: string
          format: date-time
          nullable: true
        apps:
          type: array
          items:
            type: string
        ownerId:
          type: string
          format: uuid
        owner:
          type: string
          description: Username of the account that created this code.
        createdAt:
          type: string
          format: date-time
    AccessCodeList:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items:
            $ref: "#/components/schemas/AccessCode"
    CreateAccessCodeRequest:
      type: object
      required: [appSlugs, expiresAt, maxSignups]
      properties:
        label:
          type: string
        appSlugs:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        maxSignups:
          type: integer
    TemporaryAccount:
      type: object
      required: [id, nickname, createdIp, lastIp, createdAt]
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        createdIp:
          type: string
        lastIp:
          type: string
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
    TemporaryAccountList:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/TemporaryAccount"
    DeployRequest:
      type: object
      properties:
        sha:
          type: string
        remote:
          type: string
    RepoPreviewRequest:
      type: object
      required: [remote, name]
      properties:
        remote:
          type: string
        name:
          type: string
        commit:
          type: string
        branch:
          type: string
    RepoAppDir:
      type: object
      required: [dir]
      properties:
        dir:
          type: string
    RepoPreview:
      type: object
      required: [name, remote, apps]
      properties:
        name:
          type: string
        remote:
          type: string
        commit:
          type: string
        branch:
          type: string
        apps:
          type: array
          items:
            $ref: "#/components/schemas/RepoAppDir"
    AddRepoApp:
      type: object
      required: [slug, name, description, icon, dir]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        dir:
          type: string
    AddRepoRequest:
      type: object
      required: [remote, name, apps]
      properties:
        remote:
          type: string
        name:
          type: string
        commit:
          type: string
        branch:
          type: string
        apps:
          type: array
          items:
            $ref: "#/components/schemas/AddRepoApp"
    CreateAppRequest:
      type: object
      required: [slug, name, description, icon, source]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        source:
          type: string
    DeployRepo:
      type: object
      required: [path, remote, branch]
      properties:
        path:
          type: string
        remote:
          type: string
        branch:
          type: string
        commit:
          type: string
        latest:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DeployRun"
    DeployRun:
      type: object
      required: [sha, status, startedAt, log]
      properties:
        sha:
          type: string
        status:
          type: string
          enum: [running, published, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        log:
          type: string
    DeployStatus:
      type: object
      required: [enabled, remote, branch, webhookUrl, repos]
      properties:
        enabled:
          type: boolean
        remote:
          type: string
        branch:
          type: string
        webhookUrl:
          type: string
        latest:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DeployRun"
        repos:
          type: array
          items:
            $ref: "#/components/schemas/DeployRepo"
