# bouncer-reconcile
# The deploy directory is mounted at its host path. Compose gives volume
# sources to the Docker daemon, which reads the host filesystem.
services:
  reconcile:
    image: ${REGISTRY}/bouncer:${IMAGE_TAG}
    entrypoint: ["bouncer", "reconcile"]
    env_file:
      - .env
    environment:
      DEPLOY_DIR: ${SITE_PATH}/deploy
    volumes:
      - ${SITE_PATH}/deploy:${SITE_PATH}/deploy
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
