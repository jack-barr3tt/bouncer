# Copy to .forgejo/workflows/deploy.yaml in a site repository.
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: docker
    container: node:22-alpine
    steps:
      - run: apk add --no-cache git openssh-client tar
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test and build changed apps
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: node --test scripts/*.test.mjs && node scripts/ci-build.mjs
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: sh scripts/ci-deploy.sh
