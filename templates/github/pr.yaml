# Copy to .github/workflows/pr.yaml in a site repository.
name: PR checks

on:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build changed apps
        env:
          EVENT_BEFORE: ${{ github.event.pull_request.base.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: node --test scripts/*.test.mjs && node scripts/ci-build.mjs
