# Copy to .woodpecker/deploy.yaml in a site repository.
when:
  - event: push
    branch: main

concurrency:
  limit: 1

steps:
  - name: deploy
    image: alpine:3.20
    environment:
      DEPLOY_TOKEN:
        from_secret: deploy_token
      DEPLOY_URL:
        from_secret: deploy_url
    commands:
      - apk add --no-cache curl
      - |
        curl -fsS -X POST "$DEPLOY_URL/api/deploy" \
          -H "Authorization: Bearer $DEPLOY_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"sha\":\"$CI_COMMIT_SHA\"}"
